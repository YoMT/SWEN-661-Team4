# Render Blueprint for the CareConnect API server (apps/server).
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render reads this file.
#
# The server is a self-contained pnpm-workspace package with only public deps
# (express, cors, mysql2), so it installs and runs in isolation from apps/server
# via npm — no monorepo-wide install and no workspace linking required.
services:
  - type: web
    name: careconnect-api
    runtime: node
    plan: free # bump to "starter" to avoid free-tier cold starts / spin-down
    rootDir: apps/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # TiDB Cloud connection — set the real values in the Render dashboard
      # (Environment tab). sync:false keeps secrets out of this committed file.
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        value: CareConnect
      # HMAC secret for auth tokens — generate a long random string.
      - key: AUTH_SECRET
        generateValue: true
      # Comma-separated list of allowed browser origins (the deployed web app).
      # MUST be set, or the API rejects all cross-origin requests.
      - key: CORS_ORIGIN
        sync: false
      # PORT is provided by Render automatically; the server reads process.env.PORT.
