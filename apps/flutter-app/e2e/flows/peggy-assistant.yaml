appId: com.example.flutter_app
---
# Journey: Sign in → open the Peggy AI assistant → ask a question
- runFlow: auth-login.yaml

# Open Peggy from the floating action button (semantic label, matched as text)
- tapOn: "Open Peggy assistant"
- assertVisible: "Peggy"
# Empty-state greeting is one multi-line node; the reply is one long bubble node.
- assertVisible: "(?s).*Hi, I.m Peggy.*"

- tapOn: "Ask me anything..."
- inputText: "What medication is due?"
- tapOn: "Send message"
# Peggy replies after a short typing delay
- extendedWaitUntil:
    visible: "(?s).*Metoprolol.*"
    timeout: 10000
