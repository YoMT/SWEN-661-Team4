appId: com.example.flutter_app
---
# Journey: Sign in → Symptoms → log a symptom
- runFlow: auth-login.yaml

- tapOn: "(?s)Symptoms.*"
- assertVisible: "Log a symptom"
# "?" is a regex metachar and the prompt may share a node, so match loosely
- assertVisible: "(?s).*bothering Margaret.*"

# Select a symptom, then save the entry
- tapOn: "(?s)Dizzy.*"
- tapOn: "Save to log"

- extendedWaitUntil:
    visible: "(?s).*Symptom logged.*"
    timeout: 10000
