appId: com.example.flutter_app
---
# Journey: Sign in, then visit every main tab.
# Bottom-nav items expose merged accessibility text ("Meds\nTab 2 of 5"), and
# Maestro does a full-text regex match — so match with (?s)<label>.*
- runFlow: auth-login.yaml

- tapOn: "(?s)Meds.*"
- assertVisible: "Medications"

- tapOn: "(?s)Schedule.*"
- assertVisible: "Appointments"

- tapOn: "(?s)Symptoms.*"
- assertVisible: "Log a symptom"

- tapOn: "(?s)Profile.*"
- assertVisible: "(?s).*Caregiver.*"

- tapOn: "(?s)Home.*"
- assertVisible: "Mark as taken"
